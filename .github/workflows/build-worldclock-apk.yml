name: Build World Clock APK

on:
  push:
    branches:
      - 'claude/world-clock-android-app-YftvF'
  workflow_dispatch:

jobs:
  build:
    name: Build Debug & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x WorldClock/gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('WorldClock/**/*.gradle*', 'WorldClock/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Debug APK
        working-directory: WorldClock
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Release APK (signed with debug key)
        working-directory: WorldClock
        run: ./gradlew assembleRelease --no-daemon

      - name: List generated APKs
        run: |
          echo "=== Debug APK ==="
          ls -lh WorldClock/app/build/outputs/apk/debug/*.apk 2>/dev/null || echo "No debug APK found"
          echo "=== Release APK ==="
          ls -lh WorldClock/app/build/outputs/apk/release/*.apk 2>/dev/null || echo "No release APK found"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: WorldClock-debug
          path: WorldClock/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: WorldClock-release
          path: WorldClock/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn

      - name: Build Summary
        run: |
          echo "## World Clock APK Build Complete ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### APK Details" >> $GITHUB_STEP_SUMMARY
          echo "- **App**: World Clock" >> $GITHUB_STEP_SUMMARY
          echo "- **Package**: com.worldclock.app" >> $GITHUB_STEP_SUMMARY
          echo "- **Min SDK**: Android 8.0 (API 26)" >> $GITHUB_STEP_SUMMARY
          echo "- **Target SDK**: Android 14 (API 34)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Features" >> $GITHUB_STEP_SUMMARY
          echo "- 🌍 World clock with 45 preset cities" >> $GITHUB_STEP_SUMMARY
          echo "- ⏰ Live time updates every second" >> $GITHUB_STEP_SUMMARY
          echo "- 🌙 Day/Night indicator per city" >> $GITHUB_STEP_SUMMARY
          echo "- 📱 Home screen widget with scrollable city list" >> $GITHUB_STEP_SUMMARY
          echo "- ➕ Add cities by search, swipe to remove" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download the APK from the **Artifacts** section above." >> $GITHUB_STEP_SUMMARY
